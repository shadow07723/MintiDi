<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sweet Card 💖</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        /* font-family: "Comic Sans MS", cursive, sans-serif; */
        overflow: hidden;
        position: relative;
      }

      .card {
        background: url("WhatsApp Image 2026-02-06 at 12.58.07 PM.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        padding: 20px;
        width: 380px; /* Desktop width */
        max-width: 90%; /* Responsive fallback */
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 10;
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: scale(1.05);
      }

      h2 {
        margin-bottom: 15px;
        color: #ff6f91;
      }

      p {
        color: #555;
        margin-bottom: 20px;
        font-size: 16px;
      }

      .btn-wrapper {
        position: relative;
        height: 150px;
      }

      button {
        padding: 10px 24px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        position: absolute;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .yes-btn {
        background: #ff6f91;
        color: #fff;
        left: 0;
        top: 0;
      }

      .no-btn {
        background: #f9c74f;
        color: #fff;
        left: 120px;
        top: 0;
      }

      /* Video container */
      .video-container {
        display: none;
        margin-top: 20px;
        border-radius: 15px;
        overflow: hidden;
      }

      .video-container video {
        width: 100%;
        border-radius: 15px;
      }
      h1 {
        color: #ff6f91;
        font-weight: 600;
      }

      h3 {
        color: #ff6f91;
        font-weight: 600;
      }

      /* Mobile responsiveness - only width/padding/font-size changes */
      @media (min-width: 430px) and (max-width: 1024px) {
        .card {
          padding: 20px;
          width: 90%;
          /* height: 50vh; */
        }

        .btn-wrapper {
          height: 300px;
        }

        .yes-btn {
          left: 200px;
          top: 100px;
          padding: 9px 16px;
          font-size: 60px;
        }

        .no-btn {
          left: 500px;
          top: 100px;
          padding: 9px 16px;
          font-size: 60px;
        }

        h1 {
          font-size: 80px;
          font-weight: 800;
        }

        p {
          font-size: 65px;
          font-weight: 800;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h1>Hyyy dear hubby 💕</h1>
      <p>Will you be my valentine!!! 💖💍</p>

      <div class="btn-wrapper" id="wrapper">
        <button class="yes-btn" onclick="showVideo()">Yes</button>
        <button class="no-btn" id="noBtn">No</button>
      </div>

      <div class="video-container" id="videoBox">
        <video autoplay muted loop>
          <source src="133144-755982928_medium.mp4" type="video/mp4" />
        </video>
        <h1>Congratulations you are safe </h1>
        <p>Your best decision ever 💍</p>
        <p>Your wife 🥰</p>
      </div>
    </div>

    <script>
      const noBtn = document.getElementById("noBtn");
      const wrapper = document.getElementById("wrapper");
      const videoBox = document.getElementById("videoBox");

      const isMobile = /Mobi|Android/i.test(navigator.userAgent);
      const buffer = isMobile ? 100 : 15;

      function moveButton(x, y) {
        const wrapperRect = wrapper.getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();

        let newX, newY;
        const maxX = wrapperRect.width - btnRect.width;
        const maxY = wrapperRect.height - btnRect.height;

        do {
          newX = Math.random() * maxX;
          newY = Math.random() * maxY;
        } while (
          Math.hypot(
            x - (newX + btnRect.width / 2),
            y - (newY + btnRect.height / 2),
          ) < buffer
        );

        noBtn.style.left = newX + "px";
        noBtn.style.top = newY + "px";
      }

      wrapper.addEventListener("mousemove", (e) => {
        moveButton(
          e.clientX - wrapper.getBoundingClientRect().left,
          e.clientY - wrapper.getBoundingClientRect().top,
        );
      });

      wrapper.addEventListener("touchmove", (e) => {
        const touch = e.touches[0];
        moveButton(
          touch.clientX - wrapper.getBoundingClientRect().left,
          touch.clientY - wrapper.getBoundingClientRect().top,
        );
      });

      function showVideo() {
        videoBox.style.display = "block";
      }
    </script>
  </body>
</html>
